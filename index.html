  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

= RANKS ========== -->\n        <sc-if value=\"{{isTiers}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"animation:acePop .4s ease both\">\n          <div style=\"text-align:center;margin-bottom:18px\">\n            <div style=\"font-family:Rye,serif;font-size:25px;color:var(--cream)\">Wanted Levels<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">The more you play, the higher your bounty — and the more notorious your rank.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n            <sc-for list=\"{{tiers}}\" as=\"t\" hint-placeholder-count=\"5\">\n              <div style=\"position:relative;border-radius:14px;padding:20px 18px;background:{{t.cardBg}};border:1px solid {{t.cardLine}};box-shadow:{{t.cardShadow}};opacity:{{t.dim}};overflow:hidden\">\n                <span style=\"position:absolute;top:0;left:0;right:0;height:3px;background:{{t.accent}}\"><\u002Fspan>\n                <span style=\"display:{{t.currentDisplay}};position:absolute;top:13px;right:13px;font-family:Bitter,serif;font-weight:800;font-size:9px;letter-spacing:1.5px;color:#231405;background:var(--glow);padding:3px 8px;border-radius:20px\">YOU'RE HERE<\u002Fspan>\n                <div style=\"position:relative;width:54px;height:54px;margin-bottom:13px\">\n                  <svg viewBox=\"0 0 24 24\" style=\"width:54px;height:54px;color:{{t.accent}};filter:drop-shadow(0 0 10px {{t.glow}})\"><use href=\"#ic-badge\"><\u002Fuse><\u002Fsvg>\n                  <span style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Bitter,serif;font-weight:800;font-size:14px;color:#231405\">{{t.roman}}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-family:Rye,serif;font-size:19px;color:var(--cream);line-height:1.1\">{{t.name}}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--muted);margin-top:4px;min-height:30px\">{{t.tag}}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;margin:11px 0 13px;padding:7px 10px;border-radius:9px;background:rgba(0,0,0,.22)\">\n                  <svg viewBox=\"0 0 24 24\" style=\"width:13px;height:13px;color:var(--red)\"><use href=\"#ic-star\"><\u002Fuse><\u002Fsvg>\n                  <span style=\"font-size:11.5px;color:var(--muted)\">Unlocks at<\u002Fspan>\n                  <span style=\"font-family:Bitter,serif;font-weight:800;font-size:13px;color:var(--cream);margin-left:auto\">{{t.minFmt}}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{t.perks}}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:flex-start;gap:8px;margin-bottom:7px\">\n                    <svg viewBox=\"0 0 24 24\" style=\"width:14px;height:14px;flex:none;margin-top:1px;color:{{t.accent}}\"><use href=\"#ic-check\"><\u002Fuse><\u002Fsvg>\n                    <span style=\"font-size:12.5px;color:var(--cream);line-height:1.3\">{{p}}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"margin-top:11px;font-size:10.5px;font-weight:700;letter-spacing:1px;color:{{t.stateColor}};text-transform:uppercase\">{{t.stateLabel}}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- BOTTOM NAV (mobile) -->\n  <div style=\"display:{{bottomNavDisplay}};flex:none;align-items:stretch;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(20,14,8,.85),rgba(20,14,8,.96));backdrop-filter:blur(14px)\">\n    <sc-for list=\"{{navs}}\" as=\"n\" hint-placeholder-count=\"4\">\n      <button onclick=\"{{n.onClick}}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:transparent;color:{{n.fg}};padding:9px 4px 11px;font-family:DM Sans,sans-serif;font-weight:600;font-size:10px\">\n        <svg viewBox=\"0 0 24 24\" style=\"width:22px;height:22px\"><use href=\"#{{n.icon}}\"><\u002Fuse><\u002Fsvg>\n        {{n.label}}\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- TOAST -->\n  <sc-if value=\"{{toastOpen}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"position:fixed;top:72px;left:50%;z-index:120;animation:aceToast .3s ease both;background:rgba(20,14,8,.96);border:1px solid {{toastColor}};border-radius:12px;padding:11px 22px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5)\">\n      <div style=\"font-family:Bitter,serif;font-weight:800;font-size:14px;color:{{toastColor}}\">{{toastMain}}<\u002Fdiv>\n      <div style=\"font-size:11.5px;color:var(--muted);margin-top:2px\">{{toastSub}}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- REDEEM MODAL -->\n  <sc-if value=\"{{modalOpen}}\" hint-placeholder-val=\"{{false}}\">\n    <div onclick=\"{{closeModal}}\" style=\"position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);padding:22px\">\n      <div onclick=\"{{stop}}\" style=\"position:relative;width:100%;max-width:380px;border-radius:8px;padding:24px;text-align:center;background:linear-gradient(168deg,var(--parch),var(--parch2));color:var(--parch-ink);border:1px solid var(--parch-line);box-shadow:0 30px 70px rgba(0,0,0,.6);animation:acePop .35s ease both\">\n        <div style=\"position:absolute;inset:7px;border:2px solid rgba(90,58,30,.3);border-radius:4px;pointer-events:none\"><\u002Fdiv>\n        <div style=\"position:relative\">\n          <div style=\"font-size:10px;letter-spacing:5px;font-weight:700;color:#7a5230\">REDEEM BOUNTY<\u002Fdiv>\n          <div style=\"width:74px;height:74px;margin:14px auto 12px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#8a5a2c,#4f3015);color:#f5d99a;box-shadow:inset 0 1px 0 rgba(255,225,170,.3)\"><svg viewBox=\"0 0 24 24\" style=\"width:40px;height:40px\"><use href=\"#{{modalIcon}}\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-family:Rye,serif;font-size:22px;color:#3a2413;line-height:1.1\">{{modalName}}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#7a5230;margin-top:5px\">{{modalBlurb}}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0\">\n            <span style=\"font-size:12px;color:#7a5230\">Cost<\u002Fspan>\n            <svg viewBox=\"0 0 24 24\" style=\"width:20px;height:20px;color:#b8801f\"><use href=\"#ic-coin\"><\u002Fuse><\u002Fsvg>\n            <span style=\"font-family:Bitter,serif;font-weight:800;font-size:24px;color:#3a2413\">{{modalCost}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <button onclick=\"{{closeModal}}\" style=\"flex:1;cursor:pointer;border:1px solid rgba(90,58,30,.4);background:transparent;color:#5a3a1e;font-family:DM Sans,sans-serif;font-weight:700;font-size:13px;padding:12px;border-radius:10px\">Not yet<\u002Fbutton>\n            <button onclick=\"{{confirmRedeem}}\" style=\"flex:1.5;cursor:pointer;border:none;font-family:Bitter,serif;font-weight:800;font-size:14px;padding:12px;border-radius:10px;background:{{modalCtaBg}};color:{{modalCtaFg}}\" style-hover=\"filter:brightness(1.06)\">{{modalCta}}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#9a2e22;margin-top:10px;min-height:14px\">{{modalWarn}}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- PARTICLES / FLOATS -->\n  <div ref=\"{{particlesRef}}\" style=\"position:fixed;inset:0;pointer-events:none;z-index:140;overflow:hidden\"><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:880},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Saloon Gold&quot;,&quot;Sunset Crimson&quot;,&quot;Sagebrush Green&quot;],&quot;default&quot;:&quot;Saloon Gold&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;memberName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dusty McGraw&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.partRef = React.createRef();\n    this.state = {\n      screen:'dash',\n      gold:3200,\n      bounty:2600,\n      filter:'all',\n      selectedTrail:null,\n      claimed:[],\n      rewardsWon:7,\n      streak:12,\n      mobile:(typeof window!=='undefined' ? window.innerWidth < 880 : false),\n      modal:null,\n      toast:null,\n      activity:[\n        {t:'Reached Gunslinger',      s:'Rank up',        kind:'tier'},\n        {t:'Won 100 Free Spins',      s:'Lucky Wheel',    kind:'win'},\n        {t:'Ante Up — High Noon',     s:'+120',           kind:'earn'},\n        {t:'Redeemed Sheriff Pin',    s:'-1,500',         kind:'spend'},\n        {t:'Daily ride bonus',        s:'+60',            kind:'earn'},\n      ],\n    };\n  }\n\n  componentDidMount(){\n    this._onR = () => { const m = window.innerWidth < 880; if(m!==this.state.mobile) this.setState({mobile:m}); };\n    window.addEventListener('resize', this._onR);\n  }\n  componentWillUnmount(){ window.removeEventListener('resize', this._onR); clearTimeout(this._tt); }\n\n  get TIERS(){\n    return [\n      {key:'drifter',   name:'Drifter',       min:0,    color:'#C08A4E', glow:'#E0A86A', roman:'I',   tag:'Just rode into town.',        perks:['1× bounty on all play','Daily free spin','Birthday gift']},\n      {key:'wrangler',  name:'Wrangler',      min:500,  color:'#AEB4BE', glow:'#DCE1EA', roman:'II',  tag:'Earning your spurs.',         perks:['1.1× bounty boost','3% weekly cashback','Bronze loot crate']},\n      {key:'gunslinger',name:'Gunslinger',    min:1500, color:'#E8A23D', glow:'#F5C95B', roman:'III', tag:'Quick on the draw.',          perks:['1.25× bounty boost','6% weekly cashback','Monthly tourney seat','Priority cashier']},\n      {key:'sheriff',   name:'Sheriff',       min:3500, color:'#F0C24B', glow:'#FFE08A', roman:'IV',  tag:'You are the law in this town.',perks:['1.5× bounty boost','10% weekly cashback','Personal host','Exclusive merch drops']},\n      {key:'legend',    name:'Outlaw Legend', min:7000, color:'#C0453B', glow:'#E8736A', roman:'V',   tag:'Wanted in five states.',      perks:['2× bounty boost','12% cashback','VIP events & travel','Bespoke rewards']},\n    ];\n  }\n\n  get REWARDS(){\n    return [\n      {id:'spin25', name:'25 Free Spins',       cat:'spins', cost:200,   icon:'ic-wheel',  blurb:'On Deadwood Reels'},\n      {id:'spin100',name:'100 Free Spins',      cat:'spins', cost:700,   icon:'ic-wheel',  blurb:'On any slot in the house'},\n      {id:'boost',  name:'2× Gold Rush · 1hr',  cat:'spins', cost:350,   icon:'ic-bolt',   blurb:'Double bounty for an hour'},\n      {id:'cash5',  name:'$5 Bonus Cash',       cat:'cash',  cost:500,   icon:'ic-coins',  blurb:'Straight to your stash'},\n      {id:'reload', name:'50% Reload Bonus',    cat:'cash',  cost:900,   icon:'ic-coins',  blurb:'Match on your next buy-in'},\n      {id:'cash25', name:'$25 Bonus Cash',      cat:'cash',  cost:2200,  icon:'ic-coins',  blurb:'Real spendable credit'},\n      {id:'pin',    name:'Sheriff Badge Pin',   cat:'merch', cost:1500,  icon:'ic-badge',  blurb:'Enamel collector pin'},\n      {id:'chips',  name:'ACE Poker Chip Set',  cat:'merch', cost:3000,  icon:'ic-chip',   blurb:'300 clay chips · felt case'},\n      {id:'hat',    name:'ACE Stetson Hat',     cat:'merch', cost:4000,  icon:'ic-hat',    blurb:'Genuine felt · branded band'},\n      {id:'jacket', name:'Leather Saloon Coat', cat:'merch', cost:6500,  icon:'ic-hat',    blurb:'Sheriff rank & up', tierReq:3},\n      {id:'seat',   name:'High Noon Tourney Seat',cat:'exp', cost:5000,  icon:'ic-ticket', blurb:'$10k guaranteed table', tierReq:2},\n      {id:'vegas',  name:'Weekend in Vegas',    cat:'exp',   cost:12000, icon:'ic-ticket', blurb:'Flights + suite + chips', tierReq:3},\n    ];\n  }\n\n  tierIdx(b){ const T=this.TIERS; let i=0; for(let k=0;k<T.length;k++) if(b>=T[k].min) i=k; return i; }\n  fmt(n){ return Number(n).toLocaleString('en-US'); }\n\n  palette(){\n    const p = this.props.palette || 'Saloon Gold';\n    if(p==='Sunset Crimson')   return {A:'#D9622B', AG:'#F0A35A', AR:'#C0453B'};\n    if(p==='Sagebrush Green')  return {A:'#8AA257', AG:'#B7CB7C', AR:'#C0453B'};\n    return {A:'#E8A23D', AG:'#F5C95B', AR:'#C0453B'};\n  }\n\n  float(txt,color){\n    const c = this.partRef.current; if(!c) return;\n    const el = document.createElement('div');\n    el.textContent = txt;\n    el.style.cssText = `position:absolute;left:50%;bottom:96px;transform:translateX(-50%);font-family:Bitter,serif;font-weight:800;font-size:28px;color:${color};text-shadow:0 0 16px ${color};pointer-events:none;animation:aceFloat 1.25s ease-out forwards`;\n    c.appendChild(el); setTimeout(()=>el.remove(),1300);\n  }\n  burst(n,cols){\n    const c = this.partRef.current; if(!c) return;\n    const cx = c.clientWidth/2, cy = c.clientHeight*0.46;\n    for(let i=0;i<n;i++){\n      const el=document.createElement('div');\n      const sz=4+Math.random()*9, ang=Math.random()*Math.PI*2, dist=70+Math.random()*240, dur=650+Math.random()*900;\n      const col=cols[i%cols.length];\n      el.style.cssText=`position:absolute;left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;border-radius:1px;background:${col};box-shadow:0 0 ${sz}px ${col};pointer-events:none`;\n      c.appendChild(el);\n      el.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) rotate(${Math.random()*400}deg)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});\n      setTimeout(()=>el.remove(),dur);\n    }\n  }\n  toast(main,sub,color){ this.setState({toast:{main,sub,color}}); clearTimeout(this._tt); this._tt=setTimeout(()=>this.setState({toast:null}),2600); }\n\n  ante(){\n    const prev = this.tierIdx(this.state.bounty);\n    const amt = Math.round((80+Math.random()*100)/10)*10;\n    this.float('+'+amt, '#F5C95B');\n    this.setState(s=>({\n      gold:s.gold+amt, bounty:s.bounty+amt,\n      activity:[{t:'Ante Up — table play', s:'+'+this.fmt(amt), kind:'earn'}, ...s.activity].slice(0,6)\n    }), ()=>{\n      const now = this.tierIdx(this.state.bounty);\n      if(now>prev){ const T=this.TIERS[now]; this.toast(T.name+' reached!','Your wanted level just went up',T.glow); this.burst(46,[T.color,T.glow,'#fff']); }\n    });\n  }\n\n  openRedeem(r){ if(this.state.claimed.includes(r.id)) return; if(r.tierReq!=null && this.tierIdx(this.state.bounty)<r.tierReq) return; this.setState({modal:r}); }\n  closeModal(){ this.setState({modal:null}); }\n  confirmRedeem(){\n    const r=this.state.modal; if(!r) return;\n    if(this.state.gold < r.cost){ this.toast('Not enough Gold','Earn more at the tables','#C0453B'); return; }\n    this.setState(s=>({ gold:s.gold-r.cost, claimed:[...s.claimed,r.id], rewardsWon:s.rewardsWon+1, modal:null,\n      activity:[{t:'Redeemed '+r.name, s:'-'+this.fmt(r.cost), kind:'spend'}, ...s.activity].slice(0,6) }));\n    this.burst(40,['#E8A23D','#F5C95B','#fff','#C0453B']);\n    this.toast('Claimed!', r.name+' is in your stash', '#F5C95B');\n  }\n  setScreen(k){ this.setState({screen:k}); }\n\n  reset(){\n    this.setState({\n      gold:0, bounty:0, claimed:[], rewardsWon:0, streak:0,\n      filter:'all', selectedTrail:null, modal:null,\n      activity:[{t:'Rode into town', s:'New', kind:'tier'}],\n    });\n    this.toast('Progress reset','Back to the start \\u2014 howdy, Drifter','#F5C95B');\n  }\n  setFilter(f){ this.setState({filter:f}); }\n\n  renderVals(){\n    const s=this.state, T=this.TIERS;\n    const pal=this.palette();\n    const ti=this.tierIdx(s.bounty);\n    const tier=T[ti], next=T[ti+1]||null;\n    const toNextPct = next ? Math.max(2,Math.min(100,((s.bounty-tier.min)/(next.min-tier.min))*100)) : 100;\n    const m = s.mobile;\n\n    const firstName = (this.props.memberName||'Dusty McGraw').trim().split(' ')[0];\n    const memberName = this.props.memberName||'Dusty McGraw';\n    const memberInit = memberName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();\n\n    const navDefs=[\n      {key:'dash',   label:'Saloon',       icon:'ic-home'},\n      {key:'trail',  label:'The Trail',    icon:'ic-trail'},\n      {key:'rewards',label:'Bounty Store', icon:'ic-reward'},\n      {key:'tiers',  label:'Ranks',        icon:'ic-tier'},\n    ];\n    const navs = navDefs.map(n=>{\n      const active = s.screen===n.key;\n      return {...n, active, onClick:()=>this.setScreen(n.key),\n        bg: active?'rgba(232,162,61,.14)':'transparent',\n        fg: active?'#F5C95B':(m?'#86714F':'#B49B78'),\n        bar: active?'var(--gold)':'transparent'};\n    });\n\n    const titleMap={dash:'Saloon',trail:'The Trail',rewards:'Bounty Store',tiers:'Wanted Levels'};\n\n    // dashboard helpers\n    const mapReward = (r)=>{\n      const owned=s.claimed.includes(r.id);\n      const lockedTier = r.tierReq!=null && ti<r.tierReq;\n      const afford = s.gold>=r.cost;\n      let state = owned?'owned':lockedTier?'tier':afford?'afford':'short';\n      const btnLabel = owned?'Owned':lockedTier?(T[r.tierReq].name+' only'):'Redeem';\n      const btnBg = state==='afford'?'linear-gradient(180deg,var(--glow),var(--gold-deep))':state==='owned'?'rgba(124,138,82,.22)':'rgba(255,255,255,.05)';\n      const btnFg = state==='afford'?'#231405':state==='owned'?'#B9C48F':'#8A7657';\n      return {...r, owned, state, btnLabel, btnBg, btnFg, costFmt:this.fmt(r.cost),\n        onClick:()=>this.openRedeem(r),\n        dim: state==='tier'?'.6':'1',\n        cardLine: state==='afford'?'var(--line2)':'var(--line)',\n        ownDisplay: owned?'block':'none',\n        btnCursor: (owned||lockedTier)?'default':'pointer'};\n    };\n\n    const stats=[\n      {label:'Day Streak',     value:s.streak,          icon:'ic-flame', color:'var(--red)'},\n      {label:'Rewards Won',    value:s.rewardsWon,       icon:'ic-reward',color:'var(--glow)'},\n      {label:'Wanted Level',   value:tier.roman,         icon:'ic-badge', color:tier.color},\n    ];\n\n    const activity = s.activity.map(ev=>({...ev,\n      dot: ev.kind==='tier'?'#F5C95B':ev.kind==='win'?'#7C8A52':ev.kind==='spend'?'#C0453B':'#E8A23D'}));\n\n    const cats=[{k:'all',l:'All'},{k:'spins',l:'Free Spins'},{k:'cash',l:'Bonus Cash'},{k:'merch',l:'Outfitter'},{k:'exp',l:'Experiences'}].map(c=>({\n      ...c, onClick:()=>this.setFilter(c.k),\n      bg: s.filter===c.k?'var(--gold)':'rgba(232,162,61,.07)',\n      fg: s.filter===c.k?'#231405':'#C9AE82'}));\n    const rewards=this.REWARDS.filter(r=>s.filter==='all'||r.cat===s.filter).map(mapReward);\n    const featured=mapReward(this.REWARDS.find(r=>r.id==='seat'));\n\n    const tiers=T.map((t,i)=>({...t, idx:i, minFmt:this.fmt(t.min),\n      current:i===ti, dim:i<=ti?'1':'.62',\n      currentDisplay: i===ti?'block':'none',\n      cardBg: i===ti?'linear-gradient(180deg,rgba(58,40,20,.95),rgba(36,26,15,.95))':'linear-gradient(180deg,var(--panel),var(--panel2))',\n      cardLine: i===ti?t.glow:'var(--line)',\n      cardShadow: i===ti?('0 14px 34px rgba(0,0,0,.42),0 0 0 1px '+t.color):'0 10px 24px rgba(0,0,0,.3)',\n      stateLabel: i<ti?'Cleared':i===ti?'Current rank':'Locked',\n      stateColor: i<ti?'var(--sage)':i===ti?'var(--glow)':'var(--dim)'}));\n\n    // ===== interactive trail map =====\n    // node positions as % of the 600x820 viewBox, ordered start(bottom)->goal(top)\n    const PLACES=[\n      {place:'Dusty Gulch',       x:22, y:93.4, icon:'ic-home',   desc:'Where every outlaw\\u2019s tale begins. Hitch your horse, ante up and ride.',         reward:'Daily free spin'},\n      {place:'Gold Mine Claim',   x:70, y:77,   icon:'ic-pick',   desc:'Strike paydirt in the hills. Bonus gold flows for those who dig deep.',             reward:'+150 bonus gold'},\n      {place:'Coyote Canyon',     x:30, y:60,   icon:'ic-cactus', desc:'Narrow trails and quicker draws. Survive the night to ride on through.',           reward:'2\\u00d7 Gold Rush hour'},\n      {place:'Buzzard\\u2019s Lookout', x:72, y:44, icon:'ic-mesa', desc:'High ground over the badlands. The whole valley knows your name now.',              reward:'Free tourney seat'},\n      {place:'Red River Crossing',x:28, y:28,   icon:'ic-wagon',  desc:'Ford the river to leave the lawmen behind. The town is in sight.',                  reward:'50% reload bonus'},\n      {place:next?next.name+' Town':'Outlaw\\u2019s End', x:60, y:11, icon:'ic-badge', desc:'Ride into town a legend. A fresh rank \\u2014 and richer rewards \\u2014 await.',  reward:'Rank up + crate'},\n    ];\n    let trailNodes=[];\n    let trailGoalName = next?next.name:tier.name;\n    let trailProgress = 0;\n    let trailSel = {place:tier.name, desc:tier.tag, icon:'ic-badge', bFmt:this.fmt(tier.min), reward:'\\u2014', statusLabel:'CURRENT', badgeBg:'rgba(245,201,91,.3)', badgeFg:'#5a3a1e', cta:'Ante Up'};\n    if(next){\n      const span=next.min-tier.min;\n      const raw=PLACES.map((p,i)=>{ const b=tier.min+Math.round(span*i/5); return {...p, i, b, done:s.bounty>=b, goal:i===5}; });\n      const firstNot=raw.findIndex(n=>!n.done);\n      const activeI = firstNot===-1?5:firstNot;\n      // progress along road (0 bottom -> 100 top), based on bounty within this leg\n      trailProgress = Math.max(3, Math.min(100, ((s.bounty-tier.min)/span)*100)).toFixed(1);\n      const selI = (s.selectedTrail==null) ? activeI : s.selectedTrail;\n\n      trailNodes=raw.map(n=>{\n        const status = n.done?'done':(n.i===activeI?'active':'locked');\n        const sel = n.i===selI;\n        return {...n, bFmt:this.fmt(n.b), status,\n          leftPct: n.x+'%', topPct: n.y+'%',\n          z: n.i===activeI?6:(sel?5:4),\n          size: (status==='active'||sel)?'56px':'46px',\n          iconSize: (status==='active'||sel)?'24px':'20px',\n          onClick:()=>this.setState({selectedTrail:n.i}),\n          medBg: status==='done'?'linear-gradient(135deg,var(--gold-deep),var(--gold))':status==='active'?'linear-gradient(135deg,var(--gold),var(--glow))':'linear-gradient(135deg,#2a1d10,#1a1209)',\n          medBorder: sel?'var(--glow)':status==='locked'?'rgba(232,162,61,.35)':'rgba(255,240,200,.55)',\n          medShadow: status==='active'?'0 0 20px var(--glow),0 6px 16px rgba(0,0,0,.5)':sel?'0 0 14px var(--glow),0 6px 16px rgba(0,0,0,.5)':'0 6px 14px rgba(0,0,0,.5)',\n          iconColor: status==='locked'?'rgba(232,162,61,.5)':'#231405',\n          icon: status==='locked'?'ic-lock':n.icon,\n          ringDisplay: status==='active'?'block':'none',\n          youDisplay: status==='active'?'block':'none',\n          labelColor: status==='locked'?'#c9b083':'#fff4d8'};\n      });\n\n      const sn=raw[selI];\n      const sStatus = sn.done?'done':(sn.i===activeI?'active':'locked');\n      trailSel={ place:sn.place, desc:sn.desc, icon:(sStatus==='locked'?'ic-lock':sn.icon), bFmt:this.fmt(sn.b), reward:sn.reward,\n        statusLabel: sStatus==='done'?'CLEARED':sStatus==='active'?'YOU\\u2019RE HERE':'LOCKED',\n        badgeBg: sStatus==='done'?'rgba(124,138,82,.35)':sStatus==='active'?'rgba(245,201,91,.45)':'rgba(90,58,30,.18)',\n        badgeFg: sStatus==='done'?'#3c4a20':'#5a3a1e',\n        cta: sStatus==='done'?'Ride on':'Ante Up' };\n    }\n\n    const modal=s.modal;\n    const modalAfford = modal? s.gold>=modal.cost : true;\n\n    return {\n      ...pal,\n      mobile:m,\n      sidebarDisplay: m?'none':'flex',\n      bottomNavDisplay: m?'flex':'none',\n      brandTopDisplay: m?'flex':'none',\n      titleDisplay: m?'none':'block',\n      bountyPillDisplay: m?'none':'flex',\n      anteHeroDisplay: m?'none':'inline-flex',\n\n      navs,\n      screenTitle: titleMap[s.screen],\n      isDash:s.screen==='dash', isTrail:s.screen==='trail', isRewards:s.screen==='rewards', isTiers:s.screen==='tiers',\n\n      goldFmt:this.fmt(s.gold), bountyFmt:'$'+this.fmt(s.bounty),\n      memberName, memberInit, memberHandle:'@'+firstName.toLowerCase()+'_deadeye',\n      greetName: firstName,\n\n      tierName:tier.name, tierColor:tier.color, tierGlow:tier.glow, tierTag:tier.tag,\n      nextName: next?next.name:'Top Rank', nextColor: next?next.color:'var(--glow)',\n      nextDisplay: next?'inline':'none',\n      toNextPct: toNextPct.toFixed(1)+'%',\n      toNextNote: next? (this.fmt(next.min-s.bounty)+' more bounty to '+next.name) : 'You\\u2019ve reached the highest rank \\u2014 Outlaw Legend.',\n\n      ante:()=>this.ante(), anteNote:'+80\\u2013180 bounty & gold per hand',\n      reset:()=>this.reset(),\n\n      stats, activity, cats, rewards, featured, tiers,\n\n      trailNodes, trailGoalName, trailProgress, trailSel,\n      trailEyebrow: next?('RANK '+tier.roman+' \\u2192 '+next.roman):'MAX RANK',\n\n      modalOpen: !!modal,\n      modalName: modal?modal.name:'', modalBlurb: modal?modal.blurb:'',\n      modalCost: modal?this.fmt(modal.cost):'', modalIcon: modal?modal.icon:'ic-coin',\n      modalCta: modalAfford?'Redeem now':'Need more Gold',\n      modalCtaBg: modalAfford?'linear-gradient(180deg,#8a5a2c,#4f3015)':'rgba(90,58,30,.3)',\n      modalCtaFg: modalAfford?'#f5d99a':'#8a6a48',\n      modalWarn: (modal && !modalAfford)? ('You\\u2019re '+this.fmt(modal.cost-s.gold)+' Gold short.') : '',\n      closeModal:()=>this.closeModal(), confirmRedeem:()=>this.confirmRedeem(), stop:(e)=>e.stopPropagation(),\n\n      toastOpen: !!s.toast,\n      toastMain: s.toast?s.toast.main:'', toastSub: s.toast?s.toast.sub:'', toastColor: s.toast?s.toast.color:'var(--glow)',\n\n      particlesRef:this.partRef,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
